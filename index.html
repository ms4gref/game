<style>

.card{position:relative;width:min(92vw,460px);padding:30px 28px 26px;border:1px solid #ffffff2b;border-radius:30px;background:linear-gradient(145deg,#10251bdd,#07140fee);backdrop-filter:blur(16px);box-shadow:0 28px 90px #000b,0 0 0 1px #55ff9b12 inset;text-align:center}.card:after{content:'1V1 • STREET FOOTBALL';display:block;margin-top:15px;color:#76e0a2;font-size:10px;letter-spacing:3px;font-weight:900}

.btn.secondary{background:#ffffff12;border:1px solid #ffffff20}.btn.red{background:#b92e42}

.score{min-width:155px;padding:5px 18px;border-radius:16px;background:#08141ccc;border:1px solid #ffffff22;font-size:30px;font-weight:900;text-shadow:0 2px 5px #000}
.time{font-size:13px;margin-top:3px;text-shadow:0 2px 4px #000}
#net{position:fixed;top:10px;right:12px;z-index:6;color:#d7e7df;font-size:11px;background:#07130fb5;padding:6px 9px;border-radius:10px}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
#joy{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:clamp(90px,17vw,132px);height:clamp(90px,17vw,132px);border-radius:50%;background:radial-gradient(circle at 32% 24%,#ffffff24,#ffffff0a 58%,#ffffff05);border:2px solid #ffffff42;box-shadow:inset 0 1px 0 #ffffff55,inset 0 0 25px #0005,0 10px 30px #0006;pointer-events:auto;backdrop-filter:blur(10px) saturate(125%);-webkit-backdrop-filter:blur(10px) saturate(125%)}
#stick{position:absolute;left:50%;top:50%;width:43%;height:43%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffffff72,#ffffff22 55%,#ffffff10);border:2px solid #ffffff78;box-shadow:inset 0 1px 0 #ffffff77,0 5px 18px #0007,0 0 15px #ffffff18;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#shoot{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:clamp(78px,12.5vw,108px);height:clamp(78px,12.5vw,108px);border-radius:50%;border:2px solid #ffffff88;background:radial-gradient(circle at 30% 22%,#ffffff42 0,#ff65748c 18%,#d73549a8 52%,#8e172bcc 100%);backdrop-filter:blur(10px) saturate(135%);-webkit-backdrop-filter:blur(10px) saturate(135%);color:#fff;font-size:clamp(13px,2vw,18px);font-weight:1000;letter-spacing:1px;pointer-events:auto;box-shadow:0 9px 26px #0008,0 0 0 5px #ffffff0b,0 1px 0 #fff8 inset;transition:transform .12s,filter .12s;touch-action:none}
#shoot.charge{background:radial-gradient(circle at 34% 26%,#ffd85a,#ef941f 48%,#b85b12 100%);transform:scale(1.055);box-shadow:0 10px 30px #0009,0 0 0 6px #ffd33d22,0 0 24px #ffd33d66}
#block{position:absolute;right:max(222px,calc(max(14px,env(safe-area-inset-right)) + clamp(78px,12.5vw,108px) + 98px));bottom:max(24px,env(safe-area-inset-bottom));width:clamp(58px,9.2vw,78px);height:clamp(58px,9.2vw,78px);border-radius:50%;border:2px solid #ffffff68;box-shadow:inset 0 1px 0 #ffffff66,0 8px 22px #0007;background:radial-gradient(circle at 32% 24%,#ffffff30,#f0b94a38 45%,#9b5b1448);backdrop-filter:blur(10px) saturate(125%);-webkit-backdrop-filter:blur(10px) saturate(125%);color:#fff;font-size:clamp(9px,1.6vw,13px);font-weight:900;pointer-events:auto;box-shadow:inset 0 1px 0 #ffffff55,0 8px 22px #0007;touch-action:none}#block.active{transform:scale(.94);filter:brightness(1.2)}
#pass{position:absolute;right:max(120px,calc(max(14px,env(safe-area-inset-right)) + clamp(78px,12.5vw,108px) + 8px));bottom:max(100px,calc(env(safe-area-inset-bottom) + 82px));width:clamp(58px,9.2vw,78px);height:clamp(58px,9.2vw,78px);border-radius:50%;border:2px solid #ffffff68;box-shadow:inset 0 1px 0 #ffffff66,0 8px 22px #0007;background:radial-gradient(circle at 32% 24%,#ffffff30,#58d98c38 45%,#167a4848);backdrop-filter:blur(10px) saturate(125%);-webkit-backdrop-filter:blur(10px) saturate(125%);color:#fff;font-size:clamp(9px,1.6vw,13px);font-weight:900;pointer-events:auto;box-shadow:inset 0 1px 0 #ffffff55,0 8px 22px #0007;touch-action:none}#pass.active{transform:scale(.94)}
#tackle{position:absolute;right:max(120px,calc(max(14px,env(safe-area-inset-right)) + clamp(78px,12.5vw,108px) + 8px));bottom:max(20px,env(safe-area-inset-bottom));width:clamp(64px,10vw,84px);height:clamp(64px,10vw,84px);border-radius:50%;border:2px solid #ffffff68;box-shadow:inset 0 1px 0 #ffffff66,0 8px 22px #0007;background:radial-gradient(circle at 32% 24%,#ffffff30,#438ed638 45%,#194d8648);backdrop-filter:blur(10px) saturate(125%);-webkit-backdrop-filter:blur(10px) saturate(125%);color:#fff;font-size:clamp(10px,1.7vw,14px);font-weight:900;pointer-events:auto;box-shadow:inset 0 1px 0 #ffffff55,0 8px 22px #0007;touch-action:none}#tackle:active,#tackle.active{transform:scale(.94);background:#327fc8}
#modePick{display:flex;gap:10px;margin:10px 0 14px}.modeBtn{flex:1;padding:11px;border-radius:13px;border:1px solid #ffffff1f;background:#ffffff0b;color:#a9c9ba;font-weight:900}.modeBtn.active{background:linear-gradient(135deg,#ffd85a,#e79b20);color:#102016;box-shadow:0 0 20px #ffd85a33}.modeBtn:active{transform:scale(.97)}
#pass.charge{transform:scale(1.045);filter:brightness(1.18);box-shadow:0 0 0 5px #ffd33d22,0 0 24px #ffd33d55}
#shoot.ready{box-shadow:0 0 0 5px #ffd33d44,0 0 28px #ffd33d99}
#power{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(128px,calc(env(safe-area-inset-bottom) + 105px));width:clamp(72px,12vw,100px);height:6px;border-radius:8px;background:#fff3;overflow:hidden;opacity:0}
#power i{display:block;height:100%;width:0;background:#ffd33d}
#fs{position:fixed;top:12px;left:12px;z-index:7;border:1px solid #ffffff30;background:#07130fb5;color:white;border-radius:10px;padding:7px 10px;font-size:12px}
#ping{position:fixed;top:42px;right:12px;z-index:6;color:#9fffc0;font-size:11px;background:#07130fc9;padding:6px 9px;border-radius:10px;border:1px solid #ffffff18;backdrop-filter:blur(7px);box-shadow:0 5px 18px #0005}
.card:before{content:'MATCH LOBBY';position:absolute;top:12px;left:16px;color:#ffd45a;font-size:9px;letter-spacing:3px;font-weight:900;opacity:.8}.card h1{font-size:42px}.btn{position:relative;overflow:hidden}.btn:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff28 45%,transparent 65%);transform:translateX(-120%);transition:.5s}.btn:hover:after{transform:translateX(120%)}#roomInfo{border:1px solid #4dff9a22;box-shadow:inset 0 0 24px #4dff9a08}.code{color:#ffd85a;text-shadow:0 0 20px #ffd85a44}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#06130df5;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}
@media (orientation:portrait){#rotate{display:flex}}

#menu{background:
 radial-gradient(circle at 50% 8%,#27a95b 0,#0d5a32 24%,#061b11 62%,#020806 100%)}
#menu:after{content:'';position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(circle at 15% 80%,#37ff9a12,transparent 30%),
 radial-gradient(circle at 85% 20%,#ffd84a10,transparent 28%),
 repeating-linear-gradient(135deg,transparent 0 34px,#ffffff05 35px 36px)}
.card{width:min(92vw,480px);padding:34px 30px 28px;border-radius:32px;
 background:linear-gradient(145deg,#122b20ee,#050d09f5);
 border:1px solid #7affb544;box-shadow:0 30px 100px #000c,0 0 45px #20ff7a10,inset 0 1px 0 #ffffff18}
.card:before{content:'⚡  MATCH LOBBY  •  1V1 ONLINE';top:14px;left:0;right:0;text-align:center;
 color:#a9ffd0;font-size:10px;letter-spacing:3px;text-shadow:0 0 12px #43ff9a55}
.card:after{content:'2 PLAYERS  •  90 SEC  •  FIRST TO 3';margin-top:18px;color:#6dffb0;letter-spacing:2.5px}
.card h1{font-size:43px;margin-top:6px;text-shadow:0 0 18px #5aff9a22,0 6px 22px #000}

#ping{top:44px;right:12px;min-width:88px;text-align:center;color:#aaffcc;font-weight:900;
 border:1px solid #69ffad44;background:linear-gradient(135deg,#092218dd,#06120ddd);
 box-shadow:0 0 18px #45ff9a18,0 7px 20px #0007}

</style>

<body>
<canvas id="game"></canvas>

<div id="menu">
  <div class="card">
    <h1>⚽ Football Duel</h1>
    <p>⚡ رقابت سریع • بازی آنلاین با دوستان</p><div id="modePick"><button class="modeBtn active" data-mode="1v1">1V1</button><button class="modeBtn" data-mode="2v1">2V1</button></div>
    <button class="btn" id="offlineBtn">بازی آفلاین</button>
    <button class="btn secondary" id="createBtn">ساخت روم آنلاین</button>
    <div id="joinBox">
      <input id="roomInput" maxlength="6" inputmode="numeric" placeholder="کد روم">
      <button class="btn secondary" id="joinBtn">ورود به روم</button>
    </div>
    <div id="roomInfo" class="hidden">
      <div>کد روم را به دوستت بده:</div>
      <div class="code" id="roomCode">------</div>
      <div id="waitText" style="margin-top:8px;color:#9fb6aa">منتظر ورود پلیر دوم...</div>
    </div>
    <div id="msg" style="margin-top:12px;color:#ffb7b7;font-size:13px"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="score"><span id="s1">0</span> – <span id="s2">0</span></div>
  <div class="time" id="time">00:00</div>
</div>
<div id="net" class="hidden">آفلاین</div><div id="ping" class="hidden">PING —</div>
<button id="fs" class="hidden">⛶ تمام‌صفحه</button>

<div id="controls" class="hidden">
  <div id="joy"><div id="stick"></div></div>
  <button id="block">BLOCK</button><button id="tackle">TACKLE</button>
  <button id="pass">PASS</button><button id="shoot">SHOOT</button>
  <div id="power"><i></i></div>
</div>
<div id="rotate">📱<br>گوشی را افقی کنید</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

const field={x:0,y:0,w:0,h:0};
function layout(){field.x=0;field.y=0;field.w=W;field.h=H}
const p1={x:.25,y:.5,vx:0,vy:0,r:.018,angle:0};
const p2={x:.75,y:.5,vx:0,vy:0,r:.018,angle:Math.PI};
const p3={x:.75,y:.28,vx:0,vy:0,r:.018,angle:Math.PI};
const ball={x:.5,y:.5,vx:0,vy:0,r:.010};
let score=[0,0],started=0,last=performance.now(),accumulator=0,goalFlash=0,charging=false,charge=0,lastTouch=0,kickoffCountdown=0;
const STEP=1/120;
let mode='offline',peer=null,conn=null,host=false,remoteInput={x:0,y:0,shoot:false,tackle:false,pass:false,block:false},localInput={x:0,y:0,shoot:false,tackle:false,pass:false,block:false};
let matchMode='1v1',players=[p1,p2],playerIndex=0,teamOf=[1,2,2],guestConns=[],playerInputs=[{},{},{}];
let pingMs=0,pingTimer=null,pingToken=0;
function startPing(c){clearInterval(pingTimer);const target=c||conn;if(!target)return;pingTimer=setInterval(()=>{if(!target||!target.open)return;const id=++pingToken;const sent=performance.now();try{target.send({type:'ping',id})}catch(e){}window.__pingSent={id,sent}},1000)}
function stopPing(){clearInterval(pingTimer);pingTimer=null}
function showPing(v){pingMs=v;const el=document.getElementById('ping');el.classList.remove('hidden');el.textContent='PING  '+Math.round(v)+' ms'}
let impact=0,wallImpact=0,goalNet=0,goalCelebration=0,goalSerial=0, tackleTimer=0, powerReady=false, powerReadyAt=0, lastKickAt=0, lastShotAt=0, ballControlLockUntil=0, ballControlOwner=0, passCharging=false, passCharge=0;

// Soft game audio using Web Audio API; no extra audio files are needed.
let audioCtx=null, masterGain=null, crowdGain=null, crowdTimer=null;
function audioInit(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=.16; masterGain.connect(audioCtx.destination);
  }catch(e){}
}
function tone(freq,dur,type='sine',gain=.08,when=0){
  if(!audioCtx||!masterGain)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+when);
  g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);
  g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+when+.012);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);
  o.connect(g);g.connect(masterGain);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.03);
}
function kickSound(power){ tone(110+power*85,.09,'triangle',.075); tone(190+power*120,.07,'sine',.045,.018); tone(320+power*150,.045,'square',.018,.035); }
function hitSound(){ tone(82,.07,'triangle',.045); tone(155,.045,'square',.022,.018); }
function wallSound(){
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime;
  tone(72,.16,'triangle',.105); tone(118,.13,'sine',.075,.018); tone(52,.20,'sine',.055,.030); tone(235,.06,'square',.026,.010);
  try{
    const len=Math.floor(audioCtx.sampleRate*.075),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
    const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
    f.type='lowpass';f.frequency.value=1200;g.gain.value=.040;src.buffer=buf;src.connect(f);f.connect(g);g.connect(masterGain);src.start(now);
  }catch(e){}
}
function goalSound(){
  if(!audioCtx)return;
  tone(392,.16,'sine',.065);tone(523.25,.18,'sine',.07,.10);tone(659.25,.26,'sine',.08,.22);
  tone(783.99,.34,'sine',.055,.36);
}
function startSound(){ tone(523.25,.10,'sine',.04);tone(659.25,.16,'sine',.045,.10); }
addEventListener('pointerdown',audioInit,{once:true});
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shootStart()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')shootEnd()});
addEventListener('blur',()=>{charging=false;localInput.tackle=false;document.getElementById('shoot')?.classList.remove('charge')});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function move(p,dx,dy,dt){
 const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
 const accel=2.65,speed=.43;
 p.vx+=dx*accel*dt;p.vy+=dy*accel*dt;
 const drag=Math.pow(.0018,dt);p.vx*=drag;p.vy*=drag;
 const sp=Math.hypot(p.vx,p.vy);if(sp>speed){p.vx=p.vx/sp*speed;p.vy=p.vy/sp*speed}
 p.x=clamp(p.x+p.vx*dt,.028,.972);p.y=clamp(p.y+p.vy*dt,.055,.945);
 if(sp>.025)p.angle=Math.atan2(p.vy,p.vx);
}
let fxParticles=[],ballTrail=[],goalParticles=[],screenShake=0,kickPulse=0,dribblePulse=0;
function spawnFx(x,y,type,count=8){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=(.04+Math.random()*.18)*(type==='power'?1.5:1);fxParticles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.25+Math.random()*.35,max:.6,size:.0025+Math.random()*.004,type})}}
function updateFx(dt){for(const g of goalParticles){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vy+=.22*dt;g.life-=dt}goalParticles=goalParticles.filter(g=>g.life>0);for(const f of fxParticles){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.05,dt);f.vy*=Math.pow(.05,dt);f.life-=dt}fxParticles=fxParticles.filter(f=>f.life>0);if(Math.hypot(ball.vx,ball.vy)>.06){ballTrail.push({x:ball.x,y:ball.y,life:.28})}for(const q of ballTrail)q.life-=dt;ballTrail=ballTrail.filter(q=>q.life>0);screenShake=Math.max(0,screenShake-dt*18);kickPulse=Math.max(0,kickPulse-dt*5);dribblePulse=Math.max(0,dribblePulse-dt*4)}
function drawFx(){for(const g of goalParticles){ctx.save();ctx.globalAlpha=Math.max(0,g.life/.95);ctx.fillStyle=g.c;ctx.translate(g.x*W,g.y*H);ctx.rotate(g.r);ctx.fillRect(-g.s,-g.s*.45,g.s*2,g.s*.9);ctx.restore()}for(const q of ballTrail){ctx.globalAlpha=q.life/.28*.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x*W,q.y*H,Math.max(3,Math.min(W,H)*.008*q.life/.28),0,Math.PI*2);ctx.fill()}for(const f of fxParticles){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle=f.type==='power'?'#ffd33d':'#fff';ctx.beginPath();ctx.arc(f.x*W,f.y*H,Math.max(1.5,Math.min(W,H)*f.size),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function doTackle(p){
 if(tackleTimer>0)return false;
 const other=players.find(q=>q!==p && Math.hypot(q.x-p.x,q.y-p.y)<.15);
 let connected=false;
 if(other){
   const dx=other.x-p.x,dy=other.y-p.y,od=Math.hypot(dx,dy)||1,nx=dx/od,ny=dy/od;
   const facing=Math.cos(p.angle)*nx+Math.sin(p.angle)*ny;
   if(facing>.25){
     const push=.028; other.x=clamp(other.x+nx*push,.028,.972);other.y=clamp(other.y+ny*push,.055,.945);
     other.vx+=nx*.045;other.vy+=ny*.045; impact=Math.min(1,impact+.7);dribblePulse=.75;spawnFx(other.x,other.y,'tackle',14);connected=true;
   }
 }
 if(connected){hitSound();document.getElementById('tackle').classList.add('active');setTimeout(()=>document.getElementById('tackle').classList.remove('active'),90)}
 tackleTimer=.28; return connected;
}
function doBlock(p){
 if(tackleTimer>0)return false;
 const ownLeft=p.x<.5;const inBox=ownLeft ? (ball.x<.22 && Math.abs(ball.y-.5)<.30) : (ball.x>.78 && Math.abs(ball.y-.5)<.30);
 const d=Math.hypot(ball.x-p.x,ball.y-p.y);
 if(!inBox || d>.105 || Math.hypot(ball.vx,ball.vy)<.12)return false;

   ctx.save();
   ctx.globalAlpha=.96;
   ctx.fillStyle='#fff';
   ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.font='900 '+Math.max(52,Math.min(W,H)*.17)+'px Arial';
   ctx.shadowColor='#000';ctx.shadowBlur=22;
   ctx.fillText(String(Math.ceil(kickoffCountdown)),W/2,H/2);
   ctx.font='900 '+Math.max(12,Math.min(W,H)*.028)+'px Arial';ctx.shadowBlur=10;
   ctx.fillText('KICK OFF',W/2,H/2+Math.min(W,H)*.105);
   ctx.restore();
 }
 if(goalFlash>0){
 const pulse=1+Math.sin((1.15-goalFlash)*18)*.035;
 ctx.fillStyle=`rgba(255,255,255,${Math.min(.42,goalFlash*.32)})`;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);
 ctx.fillStyle='#fff';ctx.font='900 58px Arial';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=18;
 ctx.fillText('GOAL!',0,0);ctx.restore();
}
}
function loop(t){
 const frame=Math.min(.05,(t-last)/1000);last=t;accumulator+=frame;
 while(accumulator>=STEP){update(STEP,t);accumulator-=STEP}
 render(t);requestAnimationFrame(loop)
}requestAnimationFrame(loop);

function begin(m){
 audioInit(); if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); startSound();
 mode=m;started=performance.now();score=[0,0];goalSerial=0;players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];playerIndex=(m==='online'&&!host&&playerIndex>=0)?playerIndex:0;teamOf=matchMode==='2v1'?(teamOf.length===3?teamOf:[1,1,2]):[1,2];lastTouch=0;kickoffCountdown=0;ball.x=.5;ball.y=.5;ball.vx=ball.vy=0;p1.x=.25;p1.y=.5;p1.vx=p1.vy=0;p2.x=.75;p2.y=.5;p2.vx=p2.vy=0;p3.x=.75;p3.y=.28;p3.vx=p3.vy=0;localInput.x=localInput.y=0;charging=false;charge=0;passCharging=false;passCharge=0;powerReady=false;powerReadyAt=performance.now()+(45000+Math.random()*45000);document.getElementById('shoot').classList.remove('charge','ready');document.getElementById('power').style.opacity=0;document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0';
 mode=m;started=performance.now();document.getElementById('menu').classList.add('hidden');
 ['hud','controls','fs','net'].forEach(id=>document.getElementById(id).classList.remove('hidden')); if(m==='online')document.getElementById('ping').classList.remove('hidden');
 document.getElementById('net').textContent=m==='offline'?'آفلاین':host?'آنلاین • میزبان':'آنلاین • مهمان';
}
document.getElementById('offlineBtn').onclick=()=>begin('offline');

function randCode(){return String(Math.floor(100000+Math.random()*900000))}
document.getElementById('createBtn').onclick=()=>{
 const code=randCode();host=true;mode='online';guestConns=[];conn=null;document.getElementById('roomInfo').classList.remove('hidden');document.getElementById('joinBox').classList.add('hidden');document.getElementById('roomCode').textContent=code;document.getElementById('waitText').textContent=matchMode==='2v1'?'منتظر ورود دو پلیر...':'منتظر ورود پلیر دوم...';peer=new Peer(code);
 peer.on('open',()=>{});peer.on('connection',c=>{if(matchMode==='1v1'&&guestConns.length>=1){c.close();return}if(matchMode==='2v1'&&guestConns.length>=2){c.close();return}guestConns.push(c);if(!conn)conn=c;setupConn(c,guestConns.length);try{c.send({type:'assign',slot:guestConns.length+1,mode:matchMode,teamOf})}catch(e){}document.getElementById('waitText').textContent=matchMode==='2v1'?`پلیر ${guestConns.length}/2 وصل شد`:'پلیر دوم وصل شد ✓';if((matchMode==='1v1'&&guestConns.length===1)||(matchMode==='2v1'&&guestConns.length===2)){if(matchMode==='2v1')teamOf=[1,1,2].sort(()=>Math.random()-.5);begin('online');broadcastState();}});
 peer.on('error',e=>document.getElementById('msg').textContent='خطای روم: '+e.type);
};
document.getElementById('joinBtn').onclick=()=>{const code=document.getElementById('roomInput').value.trim();if(!/^\d{6}$/.test(code)){document.getElementById('msg').textContent='کد باید ۶ رقمی باشد';return}host=false;mode='online';peer=new Peer();peer.on('open',()=>{conn=peer.connect(code,{reliable:true});setupConn(conn,0)});peer.on('error',e=>document.getElementById('msg').textContent='روم پیدا نشد یا اتصال ناموفق بود')};
function setupConn(c,slot){
 c.on('open',()=>{if(!host)document.getElementById('waitText').textContent='اتصال برقرار شد ✓';startPing(c)});
 c.on('data',data=>{if(data.type==='ping'){try{c.send({type:'pong',id:data.id})}catch(e){}return}if(data.type==='pong'&&window.__pingSent&&data.id===window.__pingSent.id){showPing(performance.now()-window.__pingSent.sent);return}
   if(host){if(data.type==='input'){playerInputs[slot]=data}else if(data.type==='action'){playerInputs[slot]=playerInputs[slot]||{};playerInputs[slot]._action=data.action;playerInputs[slot]._power=data.power||0}}
   else if(data.type==='assign'){matchMode=data.mode||'1v1';teamOf=data.teamOf||teamOf;playerIndex=Math.max(0,(data.slot||1)-1);players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];begin('online')}
   else if(data.type==='state'){matchMode=data.mode||matchMode;teamOf=data.teamOf||teamOf;players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];data.players.forEach((q,i)=>{if(players[i])Object.assign(players[i],q)});ball.x=data.b.x;ball.y=data.b.y;ball.vx=data.b.vx;ball.vy=data.b.vy;score=data.s;kickoffCountdown=Number(data.cd)||0;if(typeof data.g==='number'&&data.g>goalSerial){goalSerial=data.g;goalSound();goalFlash=1.15;goalParticles=[];for(let i=0;i<42;i++){const a=Math.random()*Math.PI*2,sp=.08+Math.random()*.24;goalParticles.push({x:.5+(Math.random()-.5)*.2,y:.5+(Math.random()-.5)*.18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.1,life:.7+Math.random()*.45,s:2+Math.random()*4,r:Math.random()*6.28,c:i%3?'#fff':'#ffd84a'})}}document.getElementById('s1').textContent=score[0];document.getElementById('s2').textContent=score[1]}});
 c.on('close',()=>{if(c===conn)stopPing();document.getElementById('net').textContent='پلیر قطع شد';if(document.getElementById('ping'))document.getElementById('ping').classList.add('hidden')});
}
document.getElementById('fs').onclick=async()=>{
 try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}
};
</script>
