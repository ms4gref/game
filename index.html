// Soft game audio using Web Audio API; no extra audio files are needed.
let audioCtx=null, masterGain=null, crowdGain=null, crowdTimer=null;
function audioInit(){

}
function tone(freq,dur,type='sine',gain=.08,when=0){

}
function kickSound(power){ tone(110+power*85,.09,'triangle',.075); tone(190+power*120,.07,'sine',.045,.018); tone(320+power*150,.045,'square',.018,.035); }
function hitSound(){ tone(82,.07,'triangle',.045); tone(155,.045,'square',.022,.018); }
function wallSound(){
  if(!audioCtx||!masterGain)return;

    const len=Math.floor(audioCtx.sampleRate*.075),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function move(p,dx,dy,dt,boost=1){
 const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}

}
let fxParticles=[],ballTrail=[],goalParticles=[],screenShake=0,kickPulse=0,dribblePulse=0;

function updateFx(dt){for(const g of goalParticles){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vy+=.22*dt;g.life-=dt}goalParticles=goalParticles.filter(g=>g.life>0);for(const f of fxParticles){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.05,dt);f.vy*=Math.pow(.05,dt);f.life-=dt}fxParticles=fxParticles.filter(f=>f.life>0);if(Math.hypot(ball.vx,ball.vy)>.06){ballTrail.push({x:ball.x,y:ball.y,life:.28})}for(const q of ballTrail)q.life-=dt;ballTrail=ballTrail.filter(q=>q.life>0);screenShake=Math.max(0,screenShake-dt*18);kickPulse=Math.max(0,kickPulse-dt*5);dribblePulse=Math.max(0,dribblePulse-dt*4)}
function drawFx(){for(const g of goalParticles){ctx.save();ctx.globalAlpha=Math.max(0,g.life/.95);ctx.fillStyle=g.c;ctx.translate(g.x*W,g.y*H);ctx.rotate(g.r);ctx.fillRect(-g.s,-g.s*.45,g.s*2,g.s*.9);ctx.restore()}for(const q of ballTrail){ctx.globalAlpha=q.life/.28*.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x*W,q.y*H,Math.max(3,Math.min(W,H)*.008*q.life/.28),0,Math.PI*2);ctx.fill()}for(const f of fxParticles){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle=f.type==='power'?'#ffd33d':'#fff';ctx.beginPath();ctx.arc(f.x*W,f.y*H,Math.max(1.5,Math.min(W,H)*f.size),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function doTackle(p){

function passBall(p,chargePower=0){
 const now=performance.now(),d=Math.hypot(ball.x-p.x,ball.y-p.y);

function goalCheck(){
 if(kickoffCountdown>0)return;
 if(ball.x<-.015||ball.x>1.015){
  // The goal belongs to the opponent of the last player who touched the ball.
  // This makes own-goals count for the other side.
  const concedingSide = ball.x<0 ? 1 : 2;
  // Score is determined by which goal was entered, so an own-goal always awards the opponent.
  const scorer = concedingSide===1 ? 2 : 1;
  score[scorer===1?0:1]++;
  goalSerial++;goalSound();goalScorer=scorer;goalFreeze=.88;
  document.getElementById('s1').textContent=score[0];document.getElementById('s2').textContent=score[1];
  goalFlash=1.35;goalNet=1;goalCelebration=1.15;
  const gb=document.getElementById('goalBanner');gb.classList.add('show');document.getElementById('goalSub').textContent=scorer===1?'⚡ گل تیم قرمز':'⚡ گل تیم آبی';
  goalParticles=[];for(let i=0;i<64;i++){const a=Math.random()*Math.PI*2,sp=.10+Math.random()*.30;goalParticles.push({x:.5+(Math.random()-.5)*.18,y:.42+(Math.random()-.5)*.16,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.12,life:.8+Math.random()*.65,s:2+Math.random()*5,r:Math.random()*6.28,c:i%4===0?'#ffd84a':i%4===1?'#fff':i%4===2?'#49e37b':'#74c7ff'})}
screenShake=0;ball.x=.5;ball.y=.5;ball.vx=ball.vy=0;players.forEach((p,i)=>{p.x=i===0?.25:i===1?.75:.5;p.y=i===2?.28:.5;p.vx=p.vy=0;p.angle=i===0?0:Math.PI});lastTouch=0;ballControlOwner=0;ballControlLockUntil=performance.now()+700;kickoffCountdown=2.12;startSound();
 }
}

function ballPlayer(p){
 const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),min=p.r+ball.r;
 if(d<min){
   const id=p===p1?1:p===p2?2:3,now=performance.now();
   // After a kick/pass, the same player cannot immediately re-capture the ball.
   // This is the hard fix for the double-pass/double-shot yo-yo bug.
   if(id===ballControlOwner && now<ballControlLockUntil)return;
   const nx=d>0?dx/d:Math.cos(p.angle),ny=d>0?dy/d:Math.sin(p.angle);
   const pvx=p.vx,pvy=p.vy,toward=pvx*nx+pvy*ny,ballToward=ball.vx*nx+ball.vy*ny;
   if(ballToward<=.015 || toward>.025){
     const push=Math.min(.010,(min-d)+.0015);
     ball.x+=nx*push;ball.y+=ny*push;
     if(toward>.025 && ballToward<.30){
       ball.vx+=nx*(toward*.13)+pvx*.022;ball.vy+=ny*(toward*.13)+pvy*.022;
     }
     lastTouch=id;dribblePulse=Math.min(1,dribblePulse+.06);
   }
 }
}

function ai(dt){
 const now=performance.now();
 for(let i=1;i<players.length;i++){
  const p=players[i],team=teamOf[i]||2,opp=team===1?2:1,st=aiState[i];
  const onlineBot=matchMode==='2v1'&&mode==='online'&&i===2;
  const offlineBot=mode==='offline';
  if(mode==='online'&&!onlineBot)continue;
  if(!offlineBot&&mode!=='online')continue;

  const enemyGoalX=team===1?1:0;
  const ownGoalX=team===1?0:1;
  const dBall=Math.hypot(ball.x-p.x,ball.y-p.y);
  const ballSpd=Math.hypot(ball.vx,ball.vy);
  const teammates=players.filter((q,j)=>q!==p&&(teamOf[j]||0)===team);
  const opponents=players.filter((q,j)=>q!==p&&(teamOf[j]||0)!==team);
  const myId=i+1;
  const hasBall=lastTouch===myId || dBall<.055;
  const nearBall=dBall<.11;
  const isSolo=matchMode==='2v1'&&team===2;

  // Predict future ball intercept
  const maxBotSpd=.43*3.4;
  const tReach=clamp(dBall/Math.max(.12,maxBotSpd),0.05,.55);
  let predX=clamp(ball.x+ball.vx*tReach*1.15,.04,.96);
  let predY=clamp(ball.y+ball.vy*tReach*1.15,.06,.94);
  if(ballSpd>.12){
    predX=clamp(predX+ball.vx*.12,.04,.96);
    predY=clamp(predY+ball.vy*.12,.06,.94);
  }

  let nearestOpp=null,oppDist=99;
  for(const o of opponents){
    const d=Math.hypot(o.x-p.x,o.y-p.y);
    if(d<oppDist){oppDist=d;nearestOpp=o}
  }
  const underPressure=oppDist<.20;

  const ballTeam=lastTouch>0?(teamOf[lastTouch-1]||0):0;
  const weHavePossession=ballTeam===team || hasBall;
  const theyHavePossession=ballTeam===opp && !hasBall;

  let tx,ty,boost;

  // DEFENSIVE
  if(theyHavePossession || (!weHavePossession && dBall>.09)){
    const goalY=.5;
    const blockT=.42;
    const blockX=ownGoalX*(1-blockT)+ball.x*blockT;
    const blockY=goalY*(1-blockT)+ball.y*blockT;
    const ballTowardUs=(team===2&&ball.vx>0.02)||(team===1&&ball.vx<-0.02);
    if(ballTowardUs || dBall<.28){
      tx=predX; ty=predY;
    } else {
      tx=clamp(blockX+(team===2?.04:-.04),.06,.94);
      ty=clamp(blockY+(ball.y-goalY)*.15,.08,.92);
    }
    const dangerZone=team===2?ball.x>.48:ball.x<.52;
    if(dangerZone && dBall<.32){
      tx=predX; ty=predY;
    }
    boost=dBall>.22?3.55:dBall>.12?2.85:1.55;
    if(dBall<.14 && oppDist<.16 && now>st.next && Math.random()<.55){
      doTackle(p);
      st.next=now+380;
    }
    if(dBall<.10 && now>st.next){
      doBlock(p);
      st.next=now+420;
    }
  }
  // ATTACKING / POSSESSION
  else if(hasBall || weHavePossession){
    const goalY=.5;
    const ga=Math.atan2(goalY-p.y,enemyGoalX-p.x);
    const angleToGoal=Math.abs(Math.atan2(goalY-p.y,enemyGoalX-p.x)-p.angle);
    const goodAngle=angleToGoal<.55 || Math.abs(p.y-.5)<.22;
    const nearGoal=team===1?p.x>.62:p.x<.38;
    const veryNearGoal=team===1?p.x>.74:p.x<.26;

    if(nearBall){
      const lane=Math.sin(now*.0016+i*1.7)*.11;
      const carryX=p.x+(enemyGoalX===1?.18:-.18);
      const carryY=clamp(p.y+lane+(goalY-p.y)*.12,.08,.92);
      tx=clamp(carryX,.05,.95);
      ty=carryY;
      p.angle=ga + lane*.4;
      boost=dBall<.045?1.15:1.55;
      if(dBall<.09){p.vx*=.78;p.vy*=.78}

      if(now>st.next){
        const mates=teammates.slice().sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
        let didAction=false;

        if((veryNearGoal || (nearGoal && goodAngle)) && !underPressure){
          p.angle=ga+(Math.random()-.5)*.12;
          const power=veryNearGoal?.78+.18*Math.random():.55+.25*Math.random();
          if(kick(p,power)){st.next=now+420;st.shootAt=now+600;didAction=true}
        }
        else if(mates.length && now>st.passAt){
          const mate=mates[0];
          const md=Math.hypot(mate.x-p.x,mate.y-p.y);
          const mateCloserToGoal=team===1?(mate.x>p.x+.08):(mate.x<p.x-.08);
          const mateOpen=!opponents.some(o=>Math.hypot(o.x-mate.x,o.y-mate.y)<.14);
          if(md>.08 && md<.68 && (underPressure || mateCloserToGoal || mateOpen)){
            p.angle=Math.atan2(mate.y-p.y,mate.x-p.x);
            const passPower=.50+.35*Math.random();
            if(passBall(p,passPower)){
              st.passAt=now+480;st.next=now+160;didAction=true;
            }
          }
        }
        if(!didAction && nearGoal && underPressure){
          p.angle=ga+(Math.random()-.5)*.2;
          if(kick(p,.62+.2*Math.random())){st.next=now+380;didAction=true}
        }
        if(!didAction){
          st.next=now+140+Math.random()*90;
        }
      }
    } else {
      tx=predX; ty=predY;
      boost=dBall>.18?3.5:2.4;
    }
  }
  // LOOSE BALL
  else {
    tx=predX; ty=predY;
    if(dBall>.28) boost=3.6;
    else if(dBall>.14) boost=2.9;
    else boost=1.45;
    if(dBall<.13){p.vx*=.72;p.vy*=.72}
    if(dBall<.12 && now>st.next && Math.random()<.4){
      doTackle(p);
      st.next=now+400;
    }
  }

  // 2v1 solo bot extra
  if(isSolo){
    if(theyHavePossession){
      tx=clamp((predX+ownGoalX*.35)/1.35,.08,.92);
      ty=clamp(predY*.7+.5*.3,.1,.9);
      boost=Math.max(boost,3.2);
    } else if(hasBall){
      boost=Math.max(boost,1.8);
    }
  }

  // Supporting width in 2v1 human side
  if(matchMode==='2v1'&&team===1&&i===1){
    const partner=players.find((q,j)=>j!==i&&(teamOf[j]||0)===team);
    if(partner && !hasBall){
      tx=clamp(partner.x+.14+(ball.x-partner.x)*.15,.08,.92);
      ty=clamp(partner.y+(ball.y<.5?.14:-.14),.1,.9);
      boost=Math.min(boost,2.2);
    }
  }

  const dx=tx-p.x, dy=ty-p.y;
  move(p,dx,dy,dt,boost);

  if(!hasBall && Math.hypot(p.vx,p.vy)>.02){
    p.angle=Math.atan2(p.vy,p.vx);
  } else if(!hasBall){
    p.angle=Math.atan2(ball.y-p.y,ball.x-p.x);
  }
 }
}

 if(!powerReady&&powerReadyAt&&performance.now()>=powerReadyAt){powerReady=true;document.getElementById('shoot').classList.add('ready')}
 if(mode==='offline'){const a=localMove();move(p1,a.x,a.y,dt);if(localInput.tackle||keys.e)doTackle(p1);if(localInput.block)doBlock(p1);ai(dt)}
 else if(host){const a=localMove();move(players[0],a.x,a.y,dt);if(localInput.tackle||keys.e)doTackle(players[0]);if(localInput.block)doBlock(players[0]);for(let i=1;i<players.length;i++){const isBot=matchMode==='2v1'&&i===2;if(isBot)continue;const ri=playerInputs[i]||{};move(players[i],ri.x||0,ri.y||0,dt);if(ri._action){applyPlayerAction(i,ri._action,ri._power||0);ri._action=null;ri._power=0}if(ri.shoot&&!ri._was)kick(players[i],ri.charge||.2);ri._was=ri.shoot}if(matchMode==='2v1')ai(dt)}
 else {const p=localPlayer(),a=localMove();move(p,a.x,a.y,dt);const now=performance.now();if(now-lastInputSendAt>20){sendInput();lastInputSendAt=now}}
 collidePlayers();for(const p of players)ballPlayer(p);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.022,dt);ball.vx*=drag;ball.vy*=drag;
 if(ball.y<.025){ball.y=.025;ball.vy=Math.abs(ball.vy)*.82;wallImpact=Math.min(1,wallImpact+.55);wallSound();spawnFx(ball.x,ball.y,'wall',10)}
 if(ball.y>.975){ball.y=.975;ball.vy=-Math.abs(ball.vy)*.82;wallImpact=Math.min(1,wallImpact+.55);wallSound();spawnFx(ball.x,ball.y,'wall',10)}
 if(Math.hypot(ball.vx,ball.vy)<.010){ball.vx=0;ball.vy=0}
 if(ball.x>.965&&Math.abs(ball.y-.5)>.15){ball.x=.965;ball.vx=-Math.abs(ball.vx)*.82;wallImpact=Math.min(1,wallImpact+.55);wallSound();spawnFx(ball.x,ball.y,'wall',10)}
 if(ball.x<.035&&Math.abs(ball.y-.5)>.15){ball.x=.035;ball.vx=Math.abs(ball.vx)*.82;wallImpact=Math.min(1,wallImpact+.55);wallSound();spawnFx(ball.x,ball.y,'wall',10)}
 impact=Math.max(0,impact-dt*3.5);wallImpact=Math.max(0,wallImpact-dt*4.5);updateFx(dt);goalCheck();goalFlash=Math.max(0,goalFlash-dt);goalNet=Math.max(0,goalNet-dt*2.4);goalCelebration=Math.max(0,goalCelebration-dt);if(goalFreeze<=0&&kickoffCountdown<=0)document.getElementById('goalBanner').classList.remove('show');
 if(host)broadcastState();const sec=Math.floor((t-started)/1000);document.getElementById('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(charging){charge=Math.min(1,charge+dt*.8);document.querySelector('#power i').style.width=(charge*100)+'%';document.getElementById('power').style.opacity=1}}
function render(t){
 drawField();
 
 if(goalNet>0){
   const a=goalNet*.65,wig=Math.sin((1-goalNet)*32)*7*goalNet;
   ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(2,H*.35);ctx.quadraticCurveTo(18+wig,H*.50,2,H*.65);ctx.stroke();
   ctx.beginPath();ctx.moveTo(W-2,H*.35);ctx.quadraticCurveTo(W-18-wig,H*.50,W-2,H*.65);ctx.stroke();
   ctx.restore();
 }
 drawFx();drawBall();drawPlayer(players[0],t,skins[players[0].skin||0].main);drawPlayer(players[1],t,skins[players[1].skin||1].main);if(players[2])drawPlayer(players[2],t,skins[players[2].skin||2].main);
 if(powerReady){ctx.save();ctx.globalAlpha=.12+.06*Math.sin(t*.01);ctx.fillStyle='#ffd33d';ctx.fillRect(W-155,H-78,130,3);ctx.restore()}
 if(kickoffCountdown>0){
   ctx.save();
   ctx.globalAlpha=.96;
   ctx.fillStyle='#fff';
   ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.font='900 '+Math.max(52,Math.min(W,H)*.17)+'px Arial';
   ctx.shadowColor='#000';ctx.shadowBlur=22;
   ctx.fillText(String(Math.ceil(kickoffCountdown)),W/2,H/2);
   ctx.font='900 '+Math.max(12,Math.min(W,H)*.028)+'px Arial';ctx.shadowBlur=10;
   ctx.fillText('KICK OFF',W/2,H/2+Math.min(W,H)*.105);
   ctx.restore();
 }
 if(goalFlash>0){
 const pulse=1+Math.sin((1.15-goalFlash)*18)*.035;
 ctx.fillStyle=`rgba(255,255,255,${Math.min(.42,goalFlash*.32)})`;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);
 ctx.fillStyle='#fff';ctx.font='900 58px Arial';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=18;
 ctx.fillText('GOAL!',0,0);ctx.restore();
}
}
function loop(t){
 const frame=Math.min(.05,(t-last)/1000);last=t;accumulator+=frame;
 while(accumulator>=STEP){update(STEP,t);accumulator-=STEP}
 render(t);requestAnimationFrame(loop)
}requestAnimationFrame(loop);

function begin(m){
 audioInit(); if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); startSound();
 mode=m;started=performance.now();score=[0,0];goalSerial=0;players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];playerIndex=(m==='online'&&!host&&playerIndex>=0)?playerIndex:0;teamOf=matchMode==='2v1'?(teamOf.length===3?teamOf:[1,1,2]):[1,2];lastTouch=0;kickoffCountdown=0;goalFreeze=0;goalScorer=0;document.getElementById('goalBanner').classList.remove('show');ball.x=.5;ball.y=.5;ball.vx=ball.vy=0;p1.x=.25;p1.y=.5;p1.vx=p1.vy=0;p2.x=matchMode==='2v1'?.28:.75;p2.y=matchMode==='2v1'?.72:.5;p2.vx=p2.vy=0;p3.x=.75;p3.y=.5;p3.vx=p3.vy=0;p1.skin=selectedSkin;p2.skin=matchMode==='2v1'?selectedSkin:1;p3.skin=2;p2.angle=0;p3.angle=Math.PI;localInput.x=localInput.y=0;charging=false;charge=0;passCharging=false;passCharge=0;powerReady=false;powerReadyAt=performance.now()+(45000+Math.random()*45000);document.getElementById('shoot').classList.remove('charge','ready');document.getElementById('power').style.opacity=0;document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0';
 mode=m;started=performance.now();document.getElementById('menu').classList.add('hidden');
 ['hud','controls','fs','net'].forEach(id=>document.getElementById(id).classList.remove('hidden')); if(m==='online')document.getElementById('ping').classList.remove('hidden');
 document.getElementById('net').textContent=m==='offline'?'آفلاین':host?'آنلاین • میزبان':'آنلاین • مهمان';
}
document.getElementById('offlineBtn').onclick=()=>begin('offline');

function randCode(){return String(Math.floor(100000+Math.random()*900000))}
document.getElementById('createBtn').onclick=()=>{
 const code=randCode();host=true;mode='online';guestConns=[];conn=null;document.getElementById('roomInfo').classList.remove('hidden');document.getElementById('joinBox').classList.add('hidden');document.getElementById('roomCode').textContent=code;document.getElementById('waitText').textContent=matchMode==='2v1'?'منتظر ورود یک هم‌تیمی...':'منتظر ورود پلیر دوم...';peer=new Peer(code);
 peer.on('open',()=>{});peer.on('connection',c=>{if(guestConns.length>=1){c.close();return}teamOf=matchMode==='2v1'?[1,1,2]:[1,2];guestConns.push(c);if(!conn)conn=c;const guestSlot=guestConns.length;setupConn(c,guestSlot);try{c.send({type:'assign',slot:guestSlot+1,mode:matchMode,teamOf})}catch(e){}document.getElementById('waitText').textContent=matchMode==='2v1'?'هم‌تیمی وصل شد • رقیب = بات حرفه‌ای':'پلیر دوم وصل شد ✓';if(guestConns.length===1){begin('online');broadcastState(true);}});
 peer.on('error',e=>document.getElementById('msg').textContent='خطای روم: '+e.type);
};
document.getElementById('joinBtn').onclick=()=>{const code=document.getElementById('roomInput').value.trim();if(!/^\d{6}$/.test(code)){document.getElementById('msg').textContent='کد باید ۶ رقمی باشد';return}host=false;mode='online';window.__roomCode=code;window.__reconnecting=false;peer=new Peer();peer.on('open',()=>{conn=peer.connect(code,{reliable:true});setupConn(conn,0)});peer.on('error',e=>document.getElementById('msg').textContent='روم پیدا نشد یا اتصال ناموفق بود')};
function setupConn(c,slot){
 c.on('open',()=>{if(!host){document.getElementById('waitText').textContent='اتصال برقرار شد ✓';try{c.send({type:'input',x:0,y:0,shoot:false,charge:0,matchMode,skin:selectedSkin})}catch(e){}}startPing(c)});
 c.on('data',data=>{if(data.type==='ping'){try{c.send({type:'pong',id:data.id})}catch(e){}return}if(data.type==='pong'&&window.__pingSent&&data.id===window.__pingSent.id){showPing(performance.now()-window.__pingSent.sent);return}
   if(host){if(data.type==='input'){playerInputs[slot]=data;if(typeof data.skin==='number'){const pi=Math.min(slot,players.length-1);if(players[pi])players[pi].skin=clamp(data.skin,0,skins.length-1)}}else if(data.type==='action'){playerInputs[slot]=playerInputs[slot]||{};playerInputs[slot]._action=data.action;playerInputs[slot]._power=data.power||0}}
   else if(data.type==='assign'){matchMode=data.mode||'1v1';teamOf=data.teamOf||teamOf;playerIndex=Math.max(0,(data.slot||1)-1);players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];begin('online')}
   else if(data.type==='state'){matchMode=data.mode||matchMode;teamOf=data.teamOf||teamOf;players=matchMode==='2v1'?[p1,p2,p3]:[p1,p2];const lp=playerIndex;data.players.forEach((q,i)=>{if(!players[i])return;if(i===lp){players[i].x+=(q.x-players[i].x)*.35;players[i].y+=(q.y-players[i].y)*.35;players[i].vx=q.vx;players[i].vy=q.vy;players[i].angle=q.angle;if(typeof q.skin==='number')players[i].skin=q.skin}else{players[i].x+=(q.x-players[i].x)*.55;players[i].y+=(q.y-players[i].y)*.55;players[i].vx=q.vx;players[i].vy=q.vy;players[i].angle=q.angle;if(typeof q.skin==='number')players[i].skin=q.skin}});ball.x+=(data.b.x-ball.x)*.6;ball.y+=(data.b.y-ball.y)*.6;ball.vx=data.b.vx;ball.vy=data.b.vy;score=data.s;kickoffCountdown=Number(data.cd)||0;if(typeof data.g==='number'&&data.g>goalSerial){goalSerial=data.g;goalSound();goalFlash=1.15;goalParticles=[];for(let i=0;i<42;i++){const a=Math.random()*Math.PI*2,sp=.08+Math.random()*.24;goalParticles.push({x:.5+(Math.random()-.5)*.2,y:.5+(Math.random()-.5)*.18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.1,life:.7+Math.random()*.45,s:2+Math.random()*4,r:Math.random()*6.28,c:i%3?'#fff':'#ffd84a'})}}document.getElementById('s1').textContent=score[0];document.getElementById('s2').textContent=score[1]}});
 c.on('close',()=>{if(c===conn)stopPing();document.getElementById('net').textContent='پلیر قطع شد';if(document.getElementById('ping'))document.getElementById('ping').classList.add('hidden');
  if(!host&&window.__roomCode&&!window.__reconnecting){window.__reconnecting=true;document.getElementById('net').textContent='در حال اتصال مجدد...';setTimeout(()=>{try{const nc=peer.connect(window.__roomCode,{reliable:true});conn=nc;setupConn(nc,0);window.__reconnecting=false;document.getElementById('net').textContent='آنلاین • مهمان'}catch(e){window.__reconnecting=false;document.getElementById('net').textContent='اتصال مجدد ناموفق'}} ,1200)}
  if(host){guestConns=guestConns.filter(g=>g!==c&&g&&g.open);document.getElementById('net').textContent=guestConns.length?'آنلاین • میزبان':'پلیر قطع شد'}
});
}

 try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}
};
